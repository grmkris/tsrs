<desc id="description">Compiler-Unions: tsrs 3.11 times faster and 1.86 times less peak memory than TypeScript 7.1.0-dev.20261022.1. Compiler: tsrs 2.55 times faster and 1.73 times less peak memory than TypeScript 7.1.0-dev.20261022.1. cal-diy: tsrs 3.49 times faster and 2.63 times less peak memory than TypeScript 7.1.0-dev.20261022.1. date-fns: tsrs 3.16 times faster and 1.70 times less peak memory than TypeScript 7.1.0-dev.20261022.1. drizzle-orm: tsrs 4.05 times faster and 2.68 times less peak memory than TypeScript 7.1.0-dev.20261022.1. formbricks-web: tsrs 3.68 times faster and 3.03 times less peak memory than TypeScript 7.1.0-dev.20261022.1. mikro-orm: tsrs 4.69 times faster and 2.85 times less peak memory than TypeScript 7.1.0-dev.20261022.1. mui-docs: tsrs 3.38 times faster and 3.30 times less peak memory than TypeScript 7.1.0-dev.20261022.1. next-packages-next: tsrs 4.53 times faster and 2.47 times less peak memory than TypeScript 7.1.0-dev.20261022.1. next-root: tsrs 3.38 times faster and 2.65 times less peak memory than TypeScript 7.1.0-dev.20261022.1. nuxt: tsrs 2.88 times faster and 2.59 times less peak memory than TypeScript 7.1.0-dev.20261022.1. playwright: tsrs 4.65 times faster and 2.47 times less peak memory than TypeScript 7.1.0-dev.20261022.1. storybook: tsrs 3.37 times faster and 2.61 times less peak memory than TypeScript 7.1.0-dev.20261022.1. supabase-studio: tsrs 4.28 times faster and 2.73 times less peak memory than TypeScript 7.1.0-dev.20261022.1. t3code-server: tsrs 5.20 times faster and 3.84 times less peak memory than TypeScript 7.1.0-dev.20261022.1. typeorm: tsrs 3.02 times faster and 2.12 times less peak memory than TypeScript 7.1.0-dev.20261022.1. vscode: tsrs 3.55 times faster and 3.05 times less peak memory than TypeScript 7.1.0-dev.20261022.1. webpack: tsrs 3.32 times faster and 2.30 times less peak memory than TypeScript 7.1.0-dev.20261022.1. xstate-main: tsrs 3.70 times faster and 2.47 times less peak memory than TypeScript 7.1.0