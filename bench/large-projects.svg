<desc id="description">Compiler-Unions: tsrs 1.92 times faster and 1.87 times less peak memory than TypeScript 7.1.0-dev.20261023.1. Compiler: tsrs 1.95 times faster and 1.74 times less peak memory than TypeScript 7.1.0-dev.20261023.1. cal-diy: tsrs 3.41 times faster and 2.74 times less peak memory than TypeScript 7.1.0-dev.20261023.1. date-fns: tsrs 2.51 times faster and 1.91 times less peak memory than TypeScript 7.1.0-dev.20261023.1. drizzle-orm: tsrs 3.27 times faster and 1.79 times less peak memory than TypeScript 7.1.0-dev.20261023.1. formbricks-web: tsrs 3.58 times faster and 3.09 times less peak memory than TypeScript 7.1.0-dev.20261023.1. mikro-orm: tsrs 4.00 times faster and 3.13 times less peak memory than TypeScript 7.1.0-dev.20261023.1. mui-docs: tsrs 4.37 times faster and 3.30 times less peak memory than TypeScript 7.1.0-dev.20261023.1. next-packages-next: tsrs 3.55 times faster and 2.58 times less peak memory than TypeScript 7.1.0-dev.20261023.1. next-root: tsrs 2.99 times faster and 2.55 times less peak memory than TypeScript 7.1.0-dev.20261023.1. nuxt: tsrs 3.73 times faster and 2.60 times less peak memory than TypeScript 7.1.0-dev.20261023.1. playwright: tsrs 2.33 times faster and 2.47 times less peak memory than TypeScript 7.1.0-dev.20261023.1. storybook: tsrs 3.48 times faster and 2.63 times less peak memory than TypeScript 7.1.0-dev.20261023.1. supabase-studio: tsrs 4.01 times faster and 2.79 times less peak memory than TypeScript 7.1.0-dev.20261023.1. t3code-server: tsrs 4.12 times faster and 3.93 times less peak memory than TypeScript 7.1.0-dev.20261023.1. typeorm: tsrs 2.91 times faster and 2.09 times less peak memory than TypeScript 7.1.0-dev.20261023.1. vscode: tsrs 3.02 times faster and 3.13 times less peak memory than TypeScript 7.1.0-dev.20261023.1. webpack: tsrs 3.28 times faster and 2.28 times less peak memory than TypeScript 7.1.0-dev.20261023.1. xstate-main: tsrs 3.33 times faster and 2.49 times less peak memory than TypeScript 7.1.0