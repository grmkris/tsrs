<desc id="description">Compiler-Unions: tsrs 2.69 times faster and 1.84 times less peak memory than TypeScript 7.1.0-dev.20261023.1. Compiler: tsrs 2.28 times faster and 1.70 times less peak memory than TypeScript 7.1.0-dev.20261023.1. cal-diy: tsrs 3.41 times faster and 2.66 times less peak memory than TypeScript 7.1.0-dev.20261023.1. date-fns: tsrs 2.68 times faster and 1.92 times less peak memory than TypeScript 7.1.0-dev.20261023.1. drizzle-orm: tsrs 3.93 times faster and 1.81 times less peak memory than TypeScript 7.1.0-dev.20261023.1. formbricks-web: tsrs 3.65 times faster and 3.03 times less peak memory than TypeScript 7.1.0-dev.20261023.1. mikro-orm: tsrs 3.47 times faster and 3.09 times less peak memory than TypeScript 7.1.0-dev.20261023.1. mui-docs: tsrs 3.98 times faster and 3.33 times less peak memory than TypeScript 7.1.0-dev.20261023.1. next-packages-next: tsrs 3.76 times faster and 2.50 times less peak memory than TypeScript 7.1.0-dev.20261023.1. next-root: tsrs 4.13 times faster and 2.54 times less peak memory than TypeScript 7.1.0-dev.20261023.1. nuxt: tsrs 3.02 times faster and 2.57 times less peak memory than TypeScript 7.1.0-dev.20261023.1. playwright: tsrs 3.00 times faster and 2.40 times less peak memory than TypeScript 7.1.0-dev.20261023.1. storybook: tsrs 3.67 times faster and 2.63 times less peak memory than TypeScript 7.1.0-dev.20261023.1. supabase-studio: tsrs 4.51 times faster and 2.74 times less peak memory than TypeScript 7.1.0-dev.20261023.1. t3code-server: tsrs 4.56 times faster and 3.86 times less peak memory than TypeScript 7.1.0-dev.20261023.1. typeorm: tsrs 2.77 times faster and 2.07 times less peak memory than TypeScript 7.1.0-dev.20261023.1. vscode: tsrs 2.92 times faster and 3.09 times less peak memory than TypeScript 7.1.0-dev.20261023.1. webpack: tsrs 5.03 times faster and 2.31 times less peak memory than TypeScript 7.1.0-dev.20261023.1. xstate-main: tsrs 3.12 times faster and 2.42 times less peak memory than TypeScript 7.1.0