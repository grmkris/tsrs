<desc id="description">Compiler-Unions: tsrs 3.31 times faster and 1.86 times less peak memory than TypeScript 7.1.0-dev.20261023.1. Compiler: tsrs 2.04 times faster and 1.73 times less peak memory than TypeScript 7.1.0-dev.20261023.1. cal-diy: tsrs 2.88 times faster and 2.68 times less peak memory than TypeScript 7.1.0-dev.20261023.1. date-fns: tsrs 2.87 times faster and 1.91 times less peak memory than TypeScript 7.1.0-dev.20261023.1. drizzle-orm: tsrs 2.73 times faster and 1.79 times less peak memory than TypeScript 7.1.0-dev.20261023.1. formbricks-web: tsrs 3.76 times faster and 3.03 times less peak memory than TypeScript 7.1.0-dev.20261023.1. mikro-orm: tsrs 4.48 times faster and 3.04 times less peak memory than TypeScript 7.1.0-dev.20261023.1. mui-docs: tsrs 3.89 times faster and 3.18 times less peak memory than TypeScript 7.1.0-dev.20261023.1. next-packages-next: tsrs 3.60 times faster and 2.52 times less peak memory than TypeScript 7.1.0-dev.20261023.1. next-root: tsrs 3.62 times faster and 2.51 times less peak memory than TypeScript 7.1.0-dev.20261023.1. nuxt: tsrs 2.31 times faster and 2.57 times less peak memory than TypeScript 7.1.0-dev.20261023.1. playwright: tsrs 1.60 times faster and 2.42 times less peak memory than TypeScript 7.1.0-dev.20261023.1. storybook: tsrs 3.49 times faster and 2.61 times less peak memory than TypeScript 7.1.0-dev.20261023.1. supabase-studio: tsrs 3.00 times faster and 2.78 times less peak memory than TypeScript 7.1.0-dev.20261023.1. t3code-server: tsrs 4.41 times faster and 3.89 times less peak memory than TypeScript 7.1.0-dev.20261023.1. typeorm: tsrs 2.94 times faster and 2.08 times less peak memory than TypeScript 7.1.0-dev.20261023.1. vscode: tsrs 3.17 times faster and 3.10 times less peak memory than TypeScript 7.1.0-dev.20261023.1. webpack: tsrs 2.96 times faster and 2.29 times less peak memory than TypeScript 7.1.0-dev.20261023.1. xstate-main: tsrs 4.56 times faster and 2.49 times less peak memory than TypeScript 7.1.0