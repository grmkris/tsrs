<title id="title">tsrs vs TypeScript 7.1.0-dev.20261023.1</title>
<desc id="description">Compiler-Unions: tsrs 2.72 times faster and 1.85 times less peak memory than TypeScript 7.1.0-dev.20261023.1. Compiler: tsrs 2.17 times faster and 1.74 times less peak memory than TypeScript 7.1.0-dev.20261023.1. cal-diy: tsrs 3.32 times faster and 2.71 times less peak memory than TypeScript 7.1.0-dev.20261023.1. date-fns: tsrs 2.88 times faster and 1.92 times less peak memory than TypeScript 7.1.0-dev.20261023.1. drizzle-orm: tsrs 3.12 times faster and 1.78 times less peak memory than TypeScript 7.1.0-dev.20261023.1. formbricks-web: tsrs 3.96 times faster and 3.06 times less peak memory than TypeScript 7.1.0-dev.20261023.1. mikro-orm: tsrs 3.51 times faster and 3.05 times less peak memory than TypeScript 7.1.0-dev.20261023.1. mui-docs: tsrs 2.62 times faster and 3.25 times less peak memory than TypeScript 7.1.0-dev.20261023.1. next-packages-next: tsrs 4.17 times faster and 2.50 times less peak memory than TypeScript 7.1.0-dev.20261023.1. next-root: tsrs 3.42 times faster and 2.54 times less peak memory than TypeScript 7.1.0-dev.20261023.1. nuxt: tsrs 3.14 times faster and 2.58 times less peak memory than TypeScript 7.1.0-dev.20261023.1. playwright: tsrs 2.94 times faster and 2.42 times less peak memory than TypeScript 7.1.0-dev.20261023.1. storybook: tsrs 4.13 times faster and 2.63 times less peak memory than TypeScript 7.1.0-dev.20261023.1. supabase-studio: tsrs 3.99 times faster and 2.72 times less peak memory than TypeScript 7.1.0-dev.20261023.1. t3code-server: tsrs 5.87 times faster and 3.82 times less peak memory than TypeScript 7.1.0-dev.20261023.1. typeorm: tsrs 2.76 times faster and 2.09 times less peak memory than TypeScript 7.1.0-dev.20261023.1. vscode: tsrs 3.78 times faster and 3.06 times less peak memory than TypeScript 7.1.0-dev.20261023.1. webpack: tsrs 2.90 times faster and 2.29 times less peak memory than TypeScript 7.1.0-dev.20261023.1. xstate-main: tsrs 3.43 times faster and 2.41 times less peak memory than TypeScript 7.1.0-dev.20261023.1.</desc>
