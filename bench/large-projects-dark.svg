<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="884" viewBox="0 0 1200 884" role="img" aria-labelledby="title description">
  <title id="title">tsrs vs TypeScript 7.1.0-beta</title>
  <desc id="description">How many times faster tsrs type-checks than tsgo (TypeScript 7.1.0-beta), against how many times less peak memory it uses, both compilers at --checkers 1, 2, 4 and 8 on an 8-vCPU Linux machine. Up and to the right is better. vscode: --checkers 1: 2.5x faster, 2.9x less memory (tsgo 16.49 s, 4.59 GiB; tsrs 6.47 s, 1.57 GiB); --checkers 2: 2.7x faster, 3.0x less memory (tsgo 9.69 s, 5.02 GiB; tsrs 3.62 s, 1.65 GiB); --checkers 4: 3.4x faster, 3.0x less memory (tsgo 6.97 s, 5.27 GiB; tsrs 2.04 s, 1.74 GiB); --checkers 8: 4.0x faster, 3.2x less memory (tsgo 5.26 s, 5.97 GiB; tsrs 1.30 s, 1.87 GiB). mui-docs: --checkers 1: 3.3x faster, 2.7x less memory (tsgo 6.24 s, 2.03 GiB; tsrs 1.90 s, 0.75 GiB); --checkers 2: 3.8x faster, 2.9x less memory (tsgo 4.89 s, 2.53 GiB; tsrs 1.29 s, 0.86 GiB); --checkers 4: 4.7x faster, 3.1x less memory (tsgo 4.57 s, 3.11 GiB; tsrs 0.98 s, 1.01 GiB); --checkers 8: 4.3x faster, 3.3x less memory (tsgo 4.14 s, 4.33 GiB; tsrs 0.96 s, 1.30 GiB). t3code-server: --checkers 1: 3.6x faster, 3.4x less memory (tsgo 10.93 s, 2.49 GiB; tsrs 3.00 s, 0.73 GiB); --checkers 2: 4.6x faster, 3.2x less memory (tsgo 9.28 s, 2.88 GiB; tsrs 2.03 s, 0.91 GiB); --checkers 4: 5.6x faster, 3.7x less memory (tsgo 8.13 s, 4.20 GiB; tsrs 1.46 s, 1.13 GiB); --checkers 8: 5.7x faster, 3.7x less memory (tsgo 8.57 s, 5.44 GiB; tsrs 1.50 s, 1.47 GiB). supabase: --checkers 1: 2.8x faster, 2.6x less memory (tsgo 8.73 s, 2.28 GiB; tsrs 3.07 s, 0.87 GiB); --checkers 2: 3.6x faster, 2.4x less memory (tsgo 7.31 s, 2.46 GiB; tsrs 2.03 s, 1.02 GiB); --checkers 4: 3.8x faster, 2.7x less memory (tsgo 4.96 s, 3.09 GiB; tsrs 1.29 s, 1.14 GiB); --checkers 8: 4.2x faster, 3.2x less memory (tsgo 3.72 s, 4.27 GiB; tsrs 0.88 s, 1.34 GiB). playwright: --checkers 1: 2.5x faster, 2.2x less memory (tsgo 1.31 s, 0.55 GiB; tsrs 0.53 s, 0.24 GiB); --checkers 2: 3.0x faster, 2.4x less memory (tsgo 0.96 s, 0.63 GiB; tsrs 0.32 s, 0.26 GiB); --checkers 4: 3.9x faster, 2.4x less memory (tsgo 0.83 s, 0.76 GiB; tsrs 0.21 s, 0.31 GiB); --checkers 8: 4.9x faster, 2.7x less memory (tsgo 0.78 s, 0.99 GiB; tsrs 0.16 s, 0.36 GiB). typeorm: --checkers 1: 2.3x faster, 2.0x less memory (tsgo 0.92 s, 0.40 GiB; tsrs 0.40 s, 0.20 GiB); --checkers 2: 2.7x faster, 2.1x less memory (tsgo 0.64 s, 0.43 GiB; tsrs 0.24 s, 0.20 GiB); --checkers 4: 2.8x faster, 2.1x less memory (tsgo 0.45 s, 0.46 GiB; tsrs 0.16 s, 0.21 GiB); --checkers 8: 3.3x faster, 2.2x less memory (tsgo 0.39 s, 0.50 GiB; tsrs 0.12 s, 0.23 GiB). date-fns: --checkers 1: 2.9x faster, 1.7x less memory (tsgo 0.16 s, 0.24 GiB; tsrs 0.05 s, 0.14 GiB); --checkers 2: 3.0x faster, 1.7x less memory (tsgo 0.17 s, 0.24 GiB; tsrs 0.06 s, 0.14 GiB); --checkers 4: 3.1x faster, 1.7x less memory (tsgo 0.17 s, 0.24 GiB; tsrs 0.05 s, 0.14 GiB); --checkers 8: 3.1x faster, 1.8x less memory (tsgo 0.17 s, 0.26 GiB; tsrs 0.06 s, 0.15 GiB). Median of 10 interleaved runs (3 for tsgo). tsrs uses PGO-optimized dist build, built like the npm release binaries. Machine: Namespace nscloud-ubuntu-24.04-amd64-8x16 (8 vCPU, 16 GB RAM, Linux x86_64, AMD EPYC). Measured 2026-10-22 06:43 UTC; tsrs commit cb5f848c51905f1d22779db7e812e0578045ea1d. TypeScript 7.1.0-beta; TypeScript reference 3e9236361fa97a9e6c685f4833ac457ae2d8c50a.</desc>
