<desc id="description">Compiler-Unions: tsrs 3.11 times faster and 1.86 times less peak memory than TypeScript 7.1.0-dev.20261022.1. Compiler: tsrs 2.51 times faster and 1.72 times less peak memory than TypeScript 7.1.0-dev.20261022.1. cal-diy: tsrs 3.23 times faster and 2.64 times less peak memory than TypeScript 7.1.0-dev.20261022.1. date-fns: tsrs 2.97 times faster and 1.69 times less peak memory than TypeScript 7.1.0-dev.20261022.1. drizzle-orm: tsrs 4.19 times faster and 2.68 times less peak memory than TypeScript 7.1.0-dev.20261022.1. formbricks-web: tsrs 3.54 times faster and 3.02 times less peak memory than TypeScript 7.1.0-dev.20261022.1. mikro-orm: tsrs 4.06 times faster and 2.85 times less peak memory than TypeScript 7.1.0-dev.20261022.1. mui-docs: tsrs 4.78 times faster and 3.21 times less peak memory than TypeScript 7.1.0-dev.20261022.1. next-packages-next: tsrs 7.05 times faster and 2.49 times less peak memory than TypeScript 7.1.0-dev.20261022.1. next-root: tsrs 3.19 times faster and 2.62 times less peak memory than TypeScript 7.1.0-dev.20261022.1. nuxt: tsrs 3.49 times faster and 2.54 times less peak memory than TypeScript 7.1.0-dev.20261022.1. playwright: tsrs 3.68 times faster and 2.49 times less peak memory than TypeScript 7.1.0-dev.20261022.1. storybook: tsrs 2.42 times faster and 2.60 times less peak memory than TypeScript 7.1.0-dev.20261022.1. supabase-studio: tsrs 4.00 times faster and 2.73 times less peak memory than TypeScript 7.1.0-dev.20261022.1. t3code-server: tsrs 8.22 times faster and 3.84 times less peak memory than TypeScript 7.1.0-dev.20261022.1. typeorm: tsrs 3.35 times faster and 2.11 times less peak memory than TypeScript 7.1.0-dev.20261022.1. vscode: tsrs 2.51 times faster and 3.13 times less peak memory than TypeScript 7.1.0-dev.20261022.1. webpack: tsrs 3.97 times faster and 2.31 times less peak memory than TypeScript 7.1.0-dev.20261022.1. xstate-main: tsrs 1.82 times faster and 2.47 times less peak memory than TypeScript 7.1.0